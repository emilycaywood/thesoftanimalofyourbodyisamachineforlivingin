[project]
name = "calflab"
version = "0.1.0"
description = "CALFLAB: co-design research platform for a calf-scale autonomous quadruped (form, mechanism, control, behavior, sensing, fabrication)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "mujoco>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "cma>=3.3",
    "ribs>=0.7",
    "trimesh>=4.4",
    "rhino3dm>=8.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Heavy CAD kernel (OpenCascade). Needed for STEP / parametric part export.
cad = ["build123d>=0.7"]
# Harness diagrams. Rendering also needs the Graphviz `dot` binary on PATH.
wire = ["wireviz>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
calflab = "calflab.cli.main:app"

[project.entry-points."calflab.plugins"]
builtin = "calflab.builtin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/calflab", "server/calflab_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
timeout = 300
markers = [
    "slow: long-running tests (evolution, CAD kernel)",
    "cad: needs the optional build123d CAD kernel",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "bridges/blender", "bridges/rhino/scripts", "bridges/rhino/grasshopper"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.12"
files = ["core/calflab", "server/calflab_server"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
