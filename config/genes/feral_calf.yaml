# Gene definition for the final feral calf (projects/robot-calf-final; ADR-066..068).
#
# Defaults are the researcher's dimensions of 2026-11-02, joint centre to joint
# centre (mm, degrees). `provisional: true` marks a starting value the
# researcher has not confirmed; the Form shows a PROVISIONAL badge on it.
#
# Belt drives are three catalog references per drive (genes belt_<drive>_system,
# _pulleys, _length: catalog ids, ADR-063, ADR-070). Their centre distance is
# derived. They are chosen in the Belts panel (set_belt_drive), never in Form,
# and evolution never varies them: a belt keeps its dimensions in every
# candidate. Geometry the belt checks depend on is marked `belt_bound`:
# evolution keeps it where every belt still passes.
#
# Evolvable: segment lengths and angles, the axle spacing and the springs.
# Fixed: the catalog choices, tubes, rails, masses and positions of parts.
#
# Bump `version` and add a migration in core/calflab/model/migrations.py when
# you rename, remove or re-scale a gene.

name: feral_calf
version: 1
description: >
  Final feral calf: hip block and chest block joined by two rails; rear legs
  hip ab/adduction -> femur (fixed in pitch) -> stifle -> tibia -> hock ->
  cannon; front legs shoulder -> upper leg -> carpus -> cannon; ten servos,
  stifles and hocks belt-driven 2:1; tension springs at stifle, hock and
  shoulder; head and neck as one lumped mass.

# What an evolution of this body uses where the Evolve panel sets nothing
# (ADR-070): archive axes that describe it, and rollouts long enough for the
# slow walk (1.5 s ramp + two 4 s cycles).
evolve:
  descriptor_x: standing_height
  descriptor_y: step_cycle
  sim: {duration_s: 9.5, start_pose: stand, stop_on_fall: true}

genes:
  # ------------------------------------------------------------- body
  - {id: axle_spacing, default: 550, min: 400, max: 700, unit: mm, group: Body, provisional: true, evolvable: true,
     label: "Hip axle to shoulder axle", description: "Distance between the hip axle and the shoulder axle (PROVISIONAL)."}
  - {id: body_length, default: 760, min: 500, max: 1000, unit: mm, group: Body, evolvable: false,
     label: "Overall body length", description: "Hip block rear face to chest block front face (about 2.5 ft). The blocks overhang the axles equally."}
  - {id: rail_spacing, default: 100, min: 80, max: 120, unit: mm, group: Body, provisional: true, evolvable: false,
     label: "Rail spacing", description: "Centre to centre of the two side-by-side body rails (PROVISIONAL, 80-120 mm)."}
  - {id: rail_type, type: enum, default: cf_rod_8mm, choices: [cf_rod_8mm, al_tube_half_inch], group: Body, provisional: true,
     evolvable: false, label: "Body rails",
     description: "Two 8 mm solid carbon fibre rods, or 1/2 in round aluminium tube with 0.049 in wall (PROVISIONAL). Aluminium density is not entered, so an aluminium rail's mass is unknown (0 g, listed)."}

  # ------------------------------------------------------------- rear legs
  - {id: femur_length, belt_bound: true, default: 200, min: 120, max: 300, unit: mm, group: Rear legs, evolvable: true,
     description: "Hip axle to stifle."}
  - {id: femur_angle, belt_bound: true, default: 40, min: 0, max: 70, unit: deg, group: Rear legs, evolvable: true,
     description: "Standing angle of the femur, forward of vertical (fixed: no hip pitch motor)."}
  - {id: tibia_length, belt_bound: true, default: 245, min: 150, max: 350, unit: mm, group: Rear legs, evolvable: true,
     description: "Stifle to hock."}
  - {id: tibia_angle, belt_bound: true, default: 35, min: 0, max: 70, unit: deg, group: Rear legs, evolvable: true,
     description: "Standing angle of the tibia, back of vertical."}
  - {id: rear_cannon_length, default: 230, min: 150, max: 330, unit: mm, group: Rear legs, evolvable: true,
     description: "Hock to the end of the cannon."}
  - {id: rear_cannon_angle, default: 10, min: -20, max: 30, unit: deg, group: Rear legs, evolvable: true,
     description: "Standing angle of the rear cannon, forward of vertical (about 10)."}

  # Turned-out legs (ADR-072): fixed mount angles of the leg's servo seat in the
  # hip block, not held by a servo. The whole leg turns with its mount, joint axes
  # and belts included; mirrored left/right. Hooves stay on the ground, back level.
  - {id: hind_leg_toe, default: 0, min: -30, max: 30, step: 0.5, unit: deg, group: Rear legs, evolvable: false,
     label: "Hind legs: toe-out", description: "The hind legs' mounts turned about the vertical, front of the leg outward (hooves point out). Negative = toe-in."}
  - {id: hind_leg_splay, default: 0, min: -15, max: 30, step: 0.5, unit: deg, group: Rear legs, evolvable: false,
     label: "Hind legs: splay", description: "The hind legs' mounts tilted about the fore-aft axis, lower end outward (hooves stand wider). Negative = inward."}

  # ------------------------------------------------------------- front legs
  - {id: upper_leg_length, belt_bound: true, default: 340, min: 200, max: 450, unit: mm, group: Front legs, evolvable: true,
     description: "Shoulder axle to carpus."}
  - {id: front_cannon_length, default: 245, min: 150, max: 350, unit: mm, group: Front legs, evolvable: true,
     description: "Carpus to the end of the cannon."}
  - {id: front_angle, default: 5, min: 0, max: 20, unit: deg, group: Front legs, evolvable: false,
     label: "Front leg angle (about)",
     description: "About this far from vertical for both front segments (upper leg leaning forward, cannon back). The back is kept level: the lab solves the actual angle, equal on both segments, so the front hooves stand at the rear hooves' height, and reports it."}
  - {id: front_leg_toe, default: 0, min: -30, max: 30, step: 0.5, unit: deg, group: Front legs, evolvable: false,
     label: "Front legs: toe-out", description: "The front legs' mounts (shoulder servo seats in the chest block) turned about the vertical, front of the leg outward. Negative = toe-in."}
  - {id: front_leg_splay, default: 0, min: -15, max: 30, step: 0.5, unit: deg, group: Front legs, evolvable: false,
     label: "Front legs: splay", description: "The front legs' mounts tilted about the fore-aft axis, lower end outward. Negative = inward."}
  - {id: hoof_pad, default: 30, min: 10, max: 60, unit: mm, group: Front legs, evolvable: false,
     label: "Hoof pad depth", description: "Ground contact this far below the end of every cannon (front and rear)."}

  # ------------------------------------------------------------- tubes (round carbon fibre)
  - {id: tube_density, default: 1.55, min: 1.0, max: 2.0, step: 0.01, unit: g/cm3, group: Tubes, provisional: true, evolvable: false,
     description: "Density of the carbon fibre tubes (and rods) (PROVISIONAL)."}
  - {id: femur_od, default: 15, min: 8, max: 25, step: 0.5, unit: mm, group: Tubes, provisional: true, evolvable: false, description: "Femur tube outer diameter. Alternatives under consideration: 14x10, 16x12."}
  - {id: femur_id, default: 12, min: 0, max: 22, step: 0.5, unit: mm, group: Tubes, provisional: true, evolvable: false, description: "Femur tube inner diameter."}
  - {id: tibia_od, default: 15, min: 8, max: 25, step: 0.5, unit: mm, group: Tubes, provisional: true, evolvable: false, description: "Tibia tube outer diameter."}
  - {id: tibia_id, default: 12, min: 0, max: 22, step: 0.5, unit: mm, group: Tubes, provisional: true, evolvable: false, description: "Tibia tube inner diameter."}
  - {id: rear_cannon_od, default: 15, min: 8, max: 25, step: 0.5, unit: mm, group: Tubes, provisional: true, evolvable: false, description: "Rear cannon tube outer diameter."}
  - {id: rear_cannon_id, default: 12, min: 0, max: 22, step: 0.5, unit: mm, group: Tubes, provisional: true, evolvable: false, description: "Rear cannon tube inner diameter."}
  - {id: upper_leg_od, default: 15, min: 8, max: 25, step: 0.5, unit: mm, group: Tubes, provisional: true, evolvable: false, description: "Front upper leg tube outer diameter."}
  - {id: upper_leg_id, default: 12, min: 0, max: 22, step: 0.5, unit: mm, group: Tubes, provisional: true, evolvable: false, description: "Front upper leg tube inner diameter."}
  - {id: front_cannon_od, default: 15, min: 8, max: 25, step: 0.5, unit: mm, group: Tubes, provisional: true, evolvable: false, description: "Front cannon tube outer diameter."}
  - {id: front_cannon_id, default: 12, min: 0, max: 22, step: 0.5, unit: mm, group: Tubes, provisional: true, evolvable: false, description: "Front cannon tube inner diameter."}

  # ------------------------------------------------------------- head, neck, battery
  - {id: head_mass, default: 150, min: 0, max: 1000, unit: g, group: Head and battery, provisional: true, evolvable: false,
     label: "Head + neck mass", description: "Lumped mass standing in for the head and the thin steel neck rods (PROVISIONAL, 0.15 kg)."}
  - {id: head_forward, default: 150, min: 0, max: 400, unit: mm, group: Head and battery, provisional: true, evolvable: false,
     label: "Head mass ahead of chest block", description: "How far the head + neck mass sits ahead of the chest block's front face (PROVISIONAL)."}
  - {id: head_height, default: 150, min: -100, max: 400, unit: mm, group: Head and battery, provisional: true, evolvable: false,
     label: "Head mass height", description: "Height of the head + neck mass above the axles (PROVISIONAL)."}
  - {id: battery_forward, default: 120, min: 0, max: 500, unit: mm, group: Head and battery, provisional: true, evolvable: false,
     label: "Batteries ahead of hip axle", description: "Where the two 3S packs hang, measured forward from the hip axle (PROVISIONAL)."}
  - {id: battery_drop, default: 50, min: 0, max: 150, unit: mm, group: Head and battery, provisional: true, evolvable: false,
     label: "Batteries below rails", description: "How far below the rails the packs hang (PROVISIONAL)."}

  # ------------------------------------------------------------- mechanism
  - {id: actuator, type: enum, default: sts3215_c018, choices: [sts3215_c018], choices_from: actuator, group: Mechanism, evolvable: false,
     label: "Servo (all ten joints)", description: "The servo on every joint. Feetech STS3215 C018 at 12 V by default."}
  # ------------------------------------------------------------- belt drives: catalog ids (ADR-070)
  # Hidden from Form; set in the Belts panel. `open`: the value is an id in the
  # project's belt catalog, checked by the build, not a list in this file.
  - {id: belt_stifle_system, type: enum, default: GT2-2mm-10mm-generic, choices: [GT2-2mm-10mm-generic], open: true, hidden: true,
     evolvable: false, group: Belts, label: "Stifle belt system", description: "Catalog id in catalog/belt_systems.json."}
  - {id: belt_stifle_pulleys, type: enum, default: 30T-60T, choices: [30T-60T], open: true, hidden: true,
     evolvable: false, group: Belts, label: "Stifle pulley pair", description: "Catalog id in catalog/pulleys.json."}
  - {id: belt_stifle_length, type: enum, default: GT2-2mm-444-C, choices: [GT2-2mm-444-C], open: true, hidden: true,
     evolvable: false, group: Belts, label: "Stifle belt length", description: "Catalog id in catalog/belt_lengths.json."}
  - {id: belt_hock_system, type: enum, default: GT2-2mm-10mm-generic, choices: [GT2-2mm-10mm-generic], open: true, hidden: true,
     evolvable: false, group: Belts, label: "Hock belt system", description: "Catalog id in catalog/belt_systems.json."}
  - {id: belt_hock_pulleys, type: enum, default: 30T-60T, choices: [30T-60T], open: true, hidden: true,
     evolvable: false, group: Belts, label: "Hock pulley pair", description: "Catalog id in catalog/pulleys.json."}
  - {id: belt_hock_length, type: enum, default: GT2-2mm-400-C, choices: [GT2-2mm-400-C], open: true, hidden: true,
     evolvable: false, group: Belts, label: "Hock belt length", description: "Catalog id in catalog/belt_lengths.json."}
  - {id: belt_carpus_system, type: enum, default: GT2-2mm-10mm-generic, choices: [GT2-2mm-10mm-generic], open: true, hidden: true,
     evolvable: false, group: Belts, label: "Carpus belt system", description: "Catalog id; used when the carpus is belted."}
  - {id: belt_carpus_pulleys, type: enum, default: 30T-60T, choices: [30T-60T], open: true, hidden: true,
     evolvable: false, group: Belts, label: "Carpus pulley pair", description: "Catalog id; used when the carpus is belted."}
  - {id: belt_carpus_length, type: enum, default: GT2-2mm-640-C, choices: [GT2-2mm-640-C], open: true, hidden: true,
     evolvable: false, group: Belts, label: "Carpus belt length", description: "Catalog id; used when the carpus is belted."}

  # Belted by default since 2026-11-02 (ADR-071); a genome that does not mention it was made with a direct carpus.
  - {id: carpus_belt, type: bool, default: true, absent: false, group: Mechanism, evolvable: false,
     label: "Belt-drive the carpus",
     description: "On = the carpus is belted 2:1 with the same belt system; its servo rides on the upper leg just below the shoulder. Off = carpus servo direct on the joint."}

  # ------------------------------------------------------------- springs (tension only; ADR-065)
  # Anchors are measured from the joint axis in the plane of the leg: 'along' up
  # the segment above (or the trunk's vertical at the shoulder) / down the segment
  # below; 'normal' across it, positive toward the front. All PROVISIONAL.
  - {id: spring_stifle, type: bool, default: true, group: Springs, provisional: true, evolvable: false,
     label: "Stifle springs", description: "Tension springs on the front (convex side) of each stifle, like the patellar ligament."}
  - {id: spring_stifle_k, default: 0.4, min: 0.0, max: 3.0, step: 0.01, unit: N/mm, group: Springs, provisional: true, label: "Stifle: rate", description: "Spring rate."}
  - {id: spring_stifle_free_length, default: 64.5, min: 10, max: 300, step: 0.5, unit: mm, group: Springs, provisional: true, label: "Stifle: free length", description: "Length with no force. Shorter = more pretension at the same anchors."}
  - {id: spring_stifle_upper_along, default: 30, min: -60, max: 200, step: 1, unit: mm, group: Springs, provisional: true, label: "Stifle: femur anchor along", description: "Up the femur from the stifle axis."}
  - {id: spring_stifle_upper_normal, default: 55, min: -100, max: 100, step: 1, unit: mm, group: Springs, provisional: true, label: "Stifle: femur anchor out", description: "Across the femur, positive toward the front."}
  - {id: spring_stifle_lower_along, default: 30, min: -60, max: 200, step: 1, unit: mm, group: Springs, provisional: true, label: "Stifle: tibia anchor along", description: "Down the tibia from the stifle axis."}
  - {id: spring_stifle_lower_normal, default: 55, min: -100, max: 100, step: 1, unit: mm, group: Springs, provisional: true, label: "Stifle: tibia anchor out", description: "Across the tibia, positive toward the front."}

  - {id: spring_hock, type: bool, default: true, group: Springs, provisional: true, evolvable: false,
     label: "Hock springs", description: "Tension springs on the back of each hock (point of hock), like the Achilles tendon."}
  - {id: spring_hock_k, default: 0.2, min: 0.0, max: 3.0, step: 0.01, unit: N/mm, group: Springs, provisional: true, label: "Hock: rate", description: "Spring rate."}
  - {id: spring_hock_free_length, default: 39.5, min: 10, max: 300, step: 0.5, unit: mm, group: Springs, provisional: true, label: "Hock: free length", description: "Length with no force."}
  - {id: spring_hock_upper_along, default: 80, min: -60, max: 200, step: 1, unit: mm, group: Springs, provisional: true, label: "Hock: tibia anchor along", description: "Up the tibia from the hock axis."}
  - {id: spring_hock_upper_normal, default: -10, min: -100, max: 100, step: 1, unit: mm, group: Springs, provisional: true, label: "Hock: tibia anchor out", description: "Across the tibia, positive toward the front (negative = behind)."}
  - {id: spring_hock_lower_along, default: -20, min: -60, max: 200, step: 1, unit: mm, group: Springs, provisional: true, label: "Hock: cannon anchor along", description: "Down the cannon from the hock axis; negative = above the axis, on a lever like the point of the hock."}
  - {id: spring_hock_lower_normal, default: -15, min: -100, max: 100, step: 1, unit: mm, group: Springs, provisional: true, label: "Hock: cannon anchor out", description: "Across the cannon, positive toward the front."}

  - {id: spring_shoulder, type: bool, default: true, group: Springs, provisional: true, evolvable: false,
     label: "Shoulder springs", description: "Tension springs behind each shoulder: that side helps rising from kneeling (in simulation the shoulder servo swings the leg back while the chest rises; a spring in front works against it)."}
  - {id: spring_shoulder_k, default: 0.2, min: 0.0, max: 3.0, step: 0.01, unit: N/mm, group: Springs, provisional: true, label: "Shoulder: rate", description: "Spring rate."}
  - {id: spring_shoulder_free_length, default: 43.5, min: 10, max: 300, step: 0.5, unit: mm, group: Springs, provisional: true, label: "Shoulder: free length", description: "Length with no force."}
  - {id: spring_shoulder_upper_along, default: 40, min: -100, max: 200, step: 1, unit: mm, group: Springs, provisional: true, label: "Shoulder: chest anchor up", description: "Above the shoulder axle, on the chest block."}
  - {id: spring_shoulder_upper_normal, default: -30, min: -150, max: 150, step: 1, unit: mm, group: Springs, provisional: true, label: "Shoulder: chest anchor forward", description: "Forward of the shoulder axle (negative = behind)."}
  - {id: spring_shoulder_lower_along, default: 40, min: -60, max: 200, step: 1, unit: mm, group: Springs, provisional: true, label: "Shoulder: upper-leg anchor along", description: "Down the upper leg from the shoulder axis."}
  - {id: spring_shoulder_lower_normal, default: -25, min: -100, max: 100, step: 1, unit: mm, group: Springs, provisional: true, label: "Shoulder: upper-leg anchor out", description: "Across the upper leg, positive toward the front."}
