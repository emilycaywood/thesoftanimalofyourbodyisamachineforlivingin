# Materials: structure and skin presets. ALL VALUES UNVERIFIED.
#
# Skin materials feed the reduced-order skin model (ADR-018):
#   mass per area      = areal_density_g_cm2 + density_g_cm3 * thickness
#   joint stiffness    = joint_stiffness_nm_per_rad_per_mm * thickness   (per covered joint)
#   joint damping      = joint_damping_nms_per_rad_per_mm * thickness
# The stiffness/damping coefficients are placeholders to be fitted from
# physical tests in Phase 3.
#
# A structure material's density gives the mass of a part: a pushed closed
# solid weighs volume x density (ADR-050). For a printed part that is not
# solid, enter the effective density you measure (mass of a printed sample /
# its outer volume) as its own entry, e.g. `pla_20pct_infill`.
# Add an entry with: calflab components new material <key>

- key: petg
  kind: material
  role: structure
  name: PETG (FDM printed)
  density_g_cm3: 1.27
  cost_usd_per_kg: 25
  color: "#b9c0c9"
  url: ""
  source: Typical filament datasheet value
  verified: false

