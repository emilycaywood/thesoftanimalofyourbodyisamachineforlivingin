- key: knit_silicone_laminate
  kind: material
  role: skin
  name: Knit + thin platinum silicone laminate
  density_g_cm3: 1.07            # silicone layer
  areal_density_g_cm2: 0.022     # knit base fabric (~220 g/m2)
  joint_stiffness_nm_per_rad_per_mm: 0.05
  joint_damping_nms_per_rad_per_mm: 0.010
  cost_usd_per_kg: 45
  color: "#d9a48f"
  url: https://www.smooth-on.com/
  source: Platinum silicone density from supplier TDS class values; mechanical coefficients are guesses
  guessed: [joint_stiffness_nm_per_rad_per_mm, joint_damping_nms_per_rad_per_mm]
  verified: false

