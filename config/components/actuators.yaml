# Actuator library.
#
# EVERY VALUE HERE IS UNVERIFIED. Numbers were written from memory of public
# datasheets and are a starting point only. Check each against the linked
# source (and ideally a bench test) before you set `verified: true`.
# Thermal parameters are order-of-magnitude guesses for a first-order model.
#
# `guessed:` lists the fields whose value is not on the datasheet (your best
# guess). A value left out or set to null is never filled in silently: a
# required one makes the entry incomplete (not selectable), an optional one is
# reported by `calflab components audit` as "default assumed".
# Add an entry with: calflab components new actuator <key>
#
# Units: mass g, dims mm (x, y, z of the housing), torque N*m, speed rpm at the
# output, current A, voltage V, cost USD.

- key: sts3215
  kind: actuator
  name: Feetech STS3215 (12 V)
  manufacturer: Feetech
  mass_g: 55
  dims_mm: [45.2, 24.7, 35.0]
  stall_torque_nm: 2.94          # 30 kg.cm @ 12 V
  stall_current_a: 2.7
  no_load_speed_rpm: 45
  voltage_v: 12.0
  gear_ratio: 345
  idle_current_a: 0.18
  armature_kgm2: 0.004
  winding_resistance_ohm: 4.4
  r_thermal_k_per_w: 9.0
  c_thermal_j_per_k: 25.0
  max_temp_c: 70
  protocol: ttl-serial-bus
  cost_usd: 25
  url: https://www.feetechrc.com/
  source: Manufacturer product page / datasheet, recalled from memory
  guessed: [r_thermal_k_per_w, c_thermal_j_per_k]
  verified: false

