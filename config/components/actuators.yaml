- key: scs0009
  kind: actuator
  name: "Feetech SCS0009 (6 V)"
  manufacturer: Feetech
  protocol: ttl-serial-bus    # half duplex asynchronous serial, 38400 bps to 1 Mbps
  mass_g: 13.2    # g; "13.2 +/- 1 g"
  dims_mm: [23.2, 12.1, 25.25]    # mm; the page's A, B, C
  cost_usd: null    # USD; not on the page (default assumed, and reported)
  stall_torque_nm: 0.2256    # N*m; "peak stall torque 2.3 kg.cm @ 6 V" x 0.0980665
  stall_current_a: 1.0    # A; "1.0 A @ 6 V"
  no_load_speed_rpm: 100    # rpm; "0.1 sec/60 deg @ 6 V" = 10 / 0.1
  voltage_v: 6.0    # V the figures are given for; operating range 4 to 7.4 V
  gear_ratio: null    # not on the page (default assumed, and reported)
  idle_current_a: 0.15    # A; "running current (at no load) 150 mA @ 6 V"
  armature_kgm2: null    # not on the page (default assumed, and reported)
  winding_resistance_ohm: null    # not on the page (default assumed, and reported)
  r_thermal_k_per_w: null    # not on the page (default assumed, and reported)
  c_thermal_j_per_k: null    # not on the page (default assumed, and reported)
  max_temp_c: null    # not on the page: it gives an operating range of -15 to 70 degC ambient, not a winding limit
  url: https://www.feetechrc.com/    # product page "6V 2.3kg serial bus servo"
  source: "Feetech product page '6V 2.3kg serial bus servo' (model SCS0009 / SC-0090-C001), saved copy supplied by the researcher, read 2026-10-09"
  guessed: []
  verified: false    # set to true yourself once every value is checked
  notes: Rated torque 0.7 kg.cm @ 6 V (0.069 N*m); 300 deg of travel; plastic case, copper + steel gears, no bearing. The page calls the output spline 25T in its text and 20T/OD 3.95 mm in its table.

