# Fitness preset R14 (ADR-108): written by docs/studies/mass_r14.py preset. Use with the optimizer
# map_elites_hardware. Bump `version` whenever you change it.
# v2 (ADR-109): mass_model explicit_v2, the Flywoo P45B 3S1P 4500 mAh pack in place of the two
# 135 g packs. Runs made with earlier versions carry their own copy.
name: hardware_r14
version: 2
description: 'R14 (ADR-108): hardware_r11c v2 (bodies at their real weight, mass_model explicit_v1) seeded with the bodies
  that hold best at that weight: g007-002, working, g012-009, each with its shoulder spring switched, its shoulder belted
  and its carpus spring on.'
terms:
- term: survival
  weight: 0.0
evaluation:
  seeds:
  - 0
  - 1
  - 2
  randomize: true
  friction:
  - 0.7
  - 1.1
  mass_scale:
  - 0.95
  - 1.05
  aggregate: worst
  torque_derating: 1.0
  servo_model: torque_speed
  hardware:
    mass_model: explicit_v2
    margin: 0.2
    servo_choices:
    - sts3215_c018
    - sts3250_c002
    servo_budget:
      sts3250_c002: 6
    drives:
    - stifle
    - hock
    - carpus
    - shoulder
    belt_systems: null
    trot_cycles_s:
    - 0.4
    - 0.45
    - 0.5
    - 0.6
    - 0.8
    trot_strides:
    - 0.5
    - 1.0
    - 1.5
    - 2.0
    trot_lift: 0.6
    screen_extra:
    - walk
    - turn
    - lie_rise
    screen_min_held: 0
    screen_min_margin: -0.25
    performance_s: 60
    performances:
    - label: R6c-calm
      ref: 20261105-053201-evolve-e4c8:g002-016
    - label: R6c-lively
      ref: 20261105-053201-evolve-e4c8:g018-025
    - label: R6c-walking
      ref: 20261105-053201-evolve-e4c8:g013-008
    - label: R6c-trotting
      ref: 20261105-053201-evolve-e4c8:g012-026
    - label: R7-calm
      ref: 20261105-232649-evolve-4237:g000-000
    - label: R7-ambling
      ref: 20261105-232649-evolve-4237:g009-004
    - label: R7-lively
      ref: 20261105-232649-evolve-4237:g000-001
    - label: R7-walking
      ref: 20261105-232649-evolve-4237:g008-000
    - label: R7-trot-walk
      ref: 20261105-232649-evolve-4237:g006-013
    - label: R7-trot-shift
      ref: 20261105-232649-evolve-4237:g001-015
    - label: R7-trotting
      ref: 20261105-232649-evolve-4237:g000-003
    cost_weights:
      servos: 1.0
      pulley_sizes: 0.25
      what_if: 0.5
      mass_kg: 1.0
      spring_sites: 0.25
    cost_weight: 0.1
    seeds_bodies:
    - label: g007-002
      note: held best at explicit_v1 (R14, ADR-108)
      values:
        rear_cannon_length: 232.0
        upper_leg_length: 344.0
        servo_hock: sts3250_c002
        servo_shoulder: sts3250_c002
        belt_stifle_pulleys: 40T-80T
        belt_hock_pulleys: GT2-40T-10+GT2-60T-10
        belt_carpus_pulleys: 40T-80T
        spring_stifle_free_length: 70.8
        spring_stifle_lower_normal: 65.0
        spring_shoulder_free_length: 64.2
    - label: g007-002 + shoulder spring off
      note: held best at explicit_v1 (R14, ADR-108) + shoulder spring off
      values:
        rear_cannon_length: 232.0
        upper_leg_length: 344.0
        servo_hock: sts3250_c002
        servo_shoulder: sts3250_c002
        belt_stifle_pulleys: 40T-80T
        belt_hock_pulleys: GT2-40T-10+GT2-60T-10
        belt_carpus_pulleys: 40T-80T
        spring_stifle_free_length: 70.8
        spring_stifle_lower_normal: 65.0
        spring_shoulder_free_length: 64.2
        spring_shoulder: false
    - label: g007-002 + belted shoulder
      note: held best at explicit_v1 (R14, ADR-108) + belted shoulder
      values:
        rear_cannon_length: 232.0
        upper_leg_length: 344.0
        servo_hock: sts3250_c002
        servo_shoulder: sts3250_c002
        belt_stifle_pulleys: 40T-80T
        belt_hock_pulleys: GT2-40T-10+GT2-60T-10
        belt_carpus_pulleys: 40T-80T
        spring_stifle_free_length: 70.8
        spring_stifle_lower_normal: 65.0
        spring_shoulder_free_length: 64.2
        shoulder_belt: true
    - label: g007-002 + carpus spring
      note: held best at explicit_v1 (R14, ADR-108) + carpus spring
      values:
        rear_cannon_length: 232.0
        upper_leg_length: 344.0
        servo_hock: sts3250_c002
        servo_shoulder: sts3250_c002
        belt_stifle_pulleys: 40T-80T
        belt_hock_pulleys: GT2-40T-10+GT2-60T-10
        belt_carpus_pulleys: 40T-80T
        spring_stifle_free_length: 70.8
        spring_stifle_lower_normal: 65.0
        spring_shoulder_free_length: 64.2
        spring_carpus: true
    - label: working
      note: held best at explicit_v1 (R14, ADR-108)
      values: {}
    - label: working + shoulder spring off
      note: held best at explicit_v1 (R14, ADR-108) + shoulder spring off
      values:
        spring_shoulder: false
    - label: working + belted shoulder
      note: held best at explicit_v1 (R14, ADR-108) + belted shoulder
      values:
        shoulder_belt: true
    - label: working + carpus spring
      note: held best at explicit_v1 (R14, ADR-108) + carpus spring
      values:
        spring_carpus: true
    - label: g012-009
      note: held best at explicit_v1 (R14, ADR-108)
      values:
        femur_length: 198.0
        rear_cannon_length: 226.0
        upper_leg_length: 344.0
        servo_hock: sts3250_c002
        servo_shoulder: sts3250_c002
        servo_carpus: sts3250_c002
        belt_stifle_pulleys: GT2-40T-10+GT2-60T-10
        belt_hock_pulleys: 40T-80T
        belt_hock_length: GT2-2mm-450-C
        belt_carpus_pulleys: GT2-80T-10+GT2-80T-10
        belt_shoulder_pulleys: GT2-30T-10+GT2-45T-10
        spring_hock_free_length: 54.3
        spring_hock_upper_along: 95.0
        spring_hip_abd_k: 0.0889
        spring_shoulder_free_length: 45.6
        spring_carpus: true
        spring_carpus_free_length: 49.1
    - label: g012-009 + shoulder spring off
      note: held best at explicit_v1 (R14, ADR-108) + shoulder spring off
      values:
        femur_length: 198.0
        rear_cannon_length: 226.0
        upper_leg_length: 344.0
        servo_hock: sts3250_c002
        servo_shoulder: sts3250_c002
        servo_carpus: sts3250_c002
        belt_stifle_pulleys: GT2-40T-10+GT2-60T-10
        belt_hock_pulleys: 40T-80T
        belt_hock_length: GT2-2mm-450-C
        belt_carpus_pulleys: GT2-80T-10+GT2-80T-10
        belt_shoulder_pulleys: GT2-30T-10+GT2-45T-10
        spring_hock_free_length: 54.3
        spring_hock_upper_along: 95.0
        spring_hip_abd_k: 0.0889
        spring_shoulder_free_length: 45.6
        spring_carpus: true
        spring_carpus_free_length: 49.1
        spring_shoulder: false
    - label: g012-009 + belted shoulder
      note: held best at explicit_v1 (R14, ADR-108) + belted shoulder
      values:
        femur_length: 198.0
        rear_cannon_length: 226.0
        upper_leg_length: 344.0
        servo_hock: sts3250_c002
        servo_shoulder: sts3250_c002
        servo_carpus: sts3250_c002
        belt_stifle_pulleys: GT2-40T-10+GT2-60T-10
        belt_hock_pulleys: 40T-80T
        belt_hock_length: GT2-2mm-450-C
        belt_carpus_pulleys: GT2-80T-10+GT2-80T-10
        belt_shoulder_pulleys: GT2-30T-10+GT2-45T-10
        spring_hock_free_length: 54.3
        spring_hock_upper_along: 95.0
        spring_hip_abd_k: 0.0889
        spring_shoulder_free_length: 45.6
        spring_carpus: true
        spring_carpus_free_length: 49.1
        shoulder_belt: true
    servo_denominator: 4
    production:
      geometry:
        genes:
        - femur_length
        - tibia_length
        - rear_cannon_length
        - upper_leg_length
        - front_cannon_length
        rel: 0.1
        step_mm: 2.0
        ratios:
        - - tibia_length
          - femur_length
        - - rear_cannon_length
          - tibia_length
        - - front_cannon_length
          - upper_leg_length
        ratio_tolerance: 0.05
      springs:
        sites:
        - hip_abd
        - stifle
        - hock
        - shoulder
        - carpus
        switch: true
        k_factors:
        - 0.5
        - 0.75
        - 1.0
        - 1.5
        - 2.0
        preload_factors:
        - 0.5
        - 1.0
        - 1.5
        along_steps_mm:
        - -15.0
        - 0.0
        - 15.0
        normal_steps_mm:
        - -10.0
        - 0.0
        - 10.0
        clearance_mm: 3.0
        sweep_step_deg: 5.0
        fitting_mm: 28.0
        lever_mm: 30.0
      pulleys: singles
      feasible_lengths: true
      shoulder_drive: true
      stop_rejected_fraction: 0.5
