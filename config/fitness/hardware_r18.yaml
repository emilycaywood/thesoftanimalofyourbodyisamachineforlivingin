        - hip_abd
        - stifle
        - hock
        - shoulder
        - carpus
        switch: true
        k_factors:
        - 0.5
        - 0.75
        - 1.0
        - 1.5
        - 2.0
        preload_factors:
        - 0.5
        - 1.0
        - 1.5
        along_steps_mm:
        - -15.0
        - 0.0
        - 15.0
        normal_steps_mm:
