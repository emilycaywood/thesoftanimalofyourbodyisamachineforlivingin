        belt_stifle_pulleys: MM-3MGT-30T+MM-3MGT-45T
        belt_stifle_length: MM-3MGT-450
        belt_hock_system: MM-3MGT-9
        belt_hock_pulleys: MM-3MGT-30T+MM-3MGT-45T
        belt_hock_length: MM-3MGT-414
        belt_carpus_system: MM-3MGT-9
        belt_carpus_pulleys: MM-3MGT-45T+MM-3MGT-45T
        belt_carpus_length: MM-3MGT-600
        shoulder_belt: true
        belt_shoulder_system: MM-3MGT-9
        belt_shoulder_pulleys: MM-3MGT-30T+MM-3MGT-45T
        belt_shoulder_length: MM-3MGT-450
    servo_denominator: 4
    production:
      geometry:
        genes:
        - femur_length
        - tibia_length
        - rear_cannon_length
        - upper_leg_length
        - front_cannon_length
        rel: 0.1
        step_mm: 2.0
        ratios:
        - - tibia_length
          - femur_length
        - - rear_cannon_length
          - tibia_length
        - - front_cannon_length
          - upper_leg_length
        ratio_tolerance: 0.05
      springs:
