    servo_denominator: 4
    production:
      geometry:
        genes:
        - femur_length
        - tibia_length
        - rear_cannon_length
        - upper_leg_length
        - front_cannon_length
        rel: 0.1
        step_mm: 2.0
        ratios:
        - - tibia_length
          - femur_length
        - - rear_cannon_length
          - tibia_length
        - - front_cannon_length
          - upper_leg_length
        ratio_tolerance: 0.05
      springs:
        sites:
        - hip_abd
        - stifle
        - hock
        - shoulder
        - carpus
        switch: true
        k_factors:
        - 0.5
        - 0.75
        - 1.0
        - 1.5
        - 2.0
        preload_factors:
        - 0.5
        - 1.0
        - 1.5
        along_steps_mm:
        - -15.0
        - 0.0
        - 15.0
        normal_steps_mm:
        - -10.0
        - 0.0
        - 10.0
        clearance_mm: 3.0
        sweep_step_deg: 5.0
        fitting_mm: 28.0
        lever_mm: 30.0
      pulleys: singles
      feasible_lengths: true
      shoulder_drive: true
      stop_rejected_fraction: 0.5
