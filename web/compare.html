<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CALFLAB: replays side by side</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #1d1f22; color: #ddd; font: 13px system-ui, sans-serif; }
      #root { display: flex; flex-direction: column; }
      .top { display: flex; gap: 6px; align-items: center; min-height: 32px; padding: 0 8px; flex-wrap: wrap; }
      .top b { color: #fff; margin-right: 6px; }
      .top button, .top select { background: #2c2f33; color: #ddd; border: 1px solid #444; border-radius: 3px; padding: 2px 10px; cursor: pointer; font: inherit; }
      .top select { max-width: 44ch; }
      .top button:hover, .top select:hover { border-color: #e8833a; }
      .top button.on { border-color: #e8833a; color: #fff; }
      .top span, .hint { color: #999; }
      .seeds { display: inline-flex; gap: 2px; }
      .hint { padding: 0 8px 4px; font-size: 12px; }
      .grid { display: grid; flex: 1; min-height: 0; gap: 1px; background: #333; }
      .cell { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #1d1f22; }
      .label { display: block; padding: 6px 10px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; text-decoration: none; }
      a.label:hover b { color: #e8833a; }
      .label b { color: #fff; margin-right: 8px; }
      .label .line { display: block; color: #aaa; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
      .playing { padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccc; }
      .sub { padding: 2px 10px 4px; display: flex; gap: 8px; align-items: center; min-height: 18px; }
      .badge { padding: 0 6px; border-radius: 3px; font-size: 12px; }
      .badge.within { background: #2f6b3a; color: #e6ffe9; }
      .badge.near { background: #a0601e; color: #fff3e6; }
      .badge.over { background: #8d2b2b; color: #ffe9e9; }
      .limit { color: #e8a0a0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .frame { position: relative; flex: 1; min-height: 0; display: flex; }
      .frame iframe, .cell > iframe { flex: 1; border: 0; }
      .note { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #999; text-align: center; padding: 12px; }
      .cell.is-empty { background: #191a1c; }
      .empty { padding: 24px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <!-- Layout only (ADR-106): see src/compare/main.ts for the URL forms. The set page renders /api/compare/<set>. -->
    <div id="root"></div>
    <script type="module" src="/src/compare/main.ts"></script>
  </body>
</html>
